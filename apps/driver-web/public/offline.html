<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0B0D10" />
    <title>Bağlantı yok | SKE Sürücü</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #0b0d10;
        color: #f4f5f7;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      main {
        max-width: 340px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 1.4rem;
      }
      p {
        margin: 0 0 24px;
        color: #a0a8b5;
        line-height: 1.5;
      }
      button {
        width: 100%;
        height: 60px;
        border: 0;
        border-radius: 16px;
        background: #d9411a;
        color: #fff;
        font: 700 19px system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="72" height="72" alt="" />
      <h1>İnternet bağlantısı yok</h1>
      <p>Sefer ve yolcu bilgileri yalnızca çevrimiçiyken gösterilir. Bağlantı gelince tekrar deneyin.</p>
      <button type="button" onclick="location.reload()">Tekrar dene</button>
    </main>
  </body>
</html>
