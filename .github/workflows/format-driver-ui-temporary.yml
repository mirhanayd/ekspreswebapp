name: Temporary driver UI formatter
on:
  push:
    branches:
      - feature/91-driver-ui-rebuild

permissions:
  contents: write

jobs:
  format-driver-ui:
    if: ${{ !contains(github.event.head_commit.message, '[skip format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/91-driver-ui-rebuild
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.4'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write "apps/driver-web/src/app/login/page.tsx" "apps/driver-web/src/components/DriverDashboard.tsx" "apps/driver-web/src/components/DriverRouteMap.tsx"
      - name: Commit branch-only formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "apps/driver-web/src/app/login/page.tsx" "apps/driver-web/src/components/DriverDashboard.tsx"
          if ! git diff --cached --quiet; then
            git commit -m "style(driver-web): format redesigned UI [skip format]"
            git push origin HEAD:feature/91-driver-ui-rebuild
          fi
