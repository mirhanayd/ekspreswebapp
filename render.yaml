services:
  - type: web
    name: ekspres-api
    runtime: node
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ekspres/contracts build && pnpm --filter @ekspres/database build && pnpm --filter api build
    preDeployCommand: pnpm db:migrate
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ekspres-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ekspres-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: WEB_ORIGINS
        sync: false
      - key: TRACKING_LATEST_TTL_SECONDS
        value: "120"
      - key: TRACKING_HISTORY_INTERVAL_SECONDS
        value: "30"

  - type: keyvalue
    name: ekspres-redis
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: journal-snapshot

databases:
  - name: ekspres-postgres
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: ekspres_db
    user: ekspres
    ipAllowList: []
